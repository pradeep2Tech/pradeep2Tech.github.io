# Java Engineering Handbook — architect quick-reference structure.
# Basics are clubbed; depth is in collections internals, concurrency, JVM, and LTS matrix.
modules:
  - id: 1
    focus: "Language Essentials"
    topics:
      - core-java-quick-ref
      - strings-and-enums-ref

  - id: 2
    focus: "OOP"
    topics:
      - oop-quick-ref
      - interfaces-and-object-contract

  - id: 3
    focus: "Collections"
    groups:
      - name: "Choose & Compare"
        topics:
          - collections-decision-matrix
          - list-set-queue-comparison
          - map-implementations-ref
          - collections-utils-and-ordering
