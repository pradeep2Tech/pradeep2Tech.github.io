# Java Engineering Handbook — interview-focused structure (6 modules + cheat sheets).
modules:
  - id: 1
    focus: "Language Fundamentals"
    topics:
      - language-fundamentals
      - strings-and-enums-interview
      - oop-interview
      - generics-interview
      - exceptions-interview
      - object-contract-interview
      - streams-collectors-interview-guide

  - id: 2
    focus: "Collections"
    topics:
      - collection-selection-matrix
      - hashmap-internals
      - concurrenthashmap-internals
      - map-implementations

  - id: 3
    focus: "Concurrency"
    groups:
      - name: "Threading & Memory Model"
        topics:
          - java-threading-interview-guide
          - java-memory-model
          - locks-and-atomics
          - cas-and-lock-free-programming
          - threadlocal-internals
          - forkjoinpool-internals
          - deadlock-detection
      - name: "Coordination & Async"
        topics:
          - concurrent-collections
          - concurrent-coordination
          - completablefuture-interview-guide
          - virtual-threads-interview-guide

  - id: 4
    focus: "JVM"
    topics:
      - jvm-memory-gc-oom-guide
      - jvm-internals
      - classloader-internals
      - classloader-memory-leaks
      - jit-escape-analysis-safepoints
      - reference-types-interview
      - jvm-flags-and-tuning

  - id: 5
    focus: "Platform APIs"
    topics:
      - reflection-interview
      - serialization-interview

  - id: 6
    focus: "Interview Cheat Sheets"
    topics:
      - top-100-java-interview-questions
      - memory-diagram-cheatsheet
      - thread-lifecycle-cheatsheet
      - collections-complexity
      - java-version-migration-guide
