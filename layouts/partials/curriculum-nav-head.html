<style>
  /* ── Compact header nav (replaces horizontal tab overflow) ── */
  #menu {
    align-items: center;
    gap: 0.35rem;
    overflow: visible;
    white-space: nowrap;
  }

  #menu li + li {
    margin-inline-start: 0;
  }

  .ekh-nav-item {
    position: relative;
    display: flex;
    align-items: center;
  }

  .ekh-nav-link,
  .ekh-nav-mega-trigger {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.35rem 0.7rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--secondary);
    text-decoration: none;
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    line-height: 1.4;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .ekh-nav-link:hover,
  .ekh-nav-mega-trigger:hover {
    color: var(--primary);
    background: var(--code-bg);
  }

  .ekh-nav-link.is-active,
  .ekh-nav-mega-trigger.is-active {
    color: var(--primary);
    background: var(--code-bg);
    border-color: var(--border);
  }

  .ekh-nav-link-icon {
    font-size: 1rem;
    opacity: 0.85;
  }

  .ekh-nav-mega-trigger .ekh-nav-chevron {
    transition: transform 0.18s ease;
    opacity: 0.7;
  }

  .ekh-nav-mega-trigger[aria-expanded="true"] .ekh-nav-chevron {
    transform: rotate(180deg);
  }

  .ekh-nav-mega-panel {
    position: absolute;
    top: calc(100% + 0.5rem);
    right: 0;
    z-index: 200;
    min-width: min(640px, calc(100vw - 2rem));
    max-width: 720px;
    padding: 0.85rem;
    border-radius: 12px;
    background: var(--entry);
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
  }

  html[data-theme="dark"] .ekh-nav-mega-panel {
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }

  .ekh-nav-mega-panel[hidden] {
    display: none !important;
  }

  .ekh-nav-mega-inner {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem 1.25rem;
  }

  .ekh-nav-mega-group {
    --ekh-nav-accent: #4f46e5;
  }

  .ekh-nav-mega-group-title {
    margin: 0 0 0.45rem;
    padding-left: 0.55rem;
    border-left: 3px solid var(--ekh-nav-accent);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ekh-nav-accent);
    line-height: 1.3;
  }

  .ekh-nav-mega-links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .ekh-nav-mega-link {
    display: block;
    padding: 0.35rem 0.55rem;
    border-radius: 6px;
    font-size: 0.84rem;
    font-weight: 500;
    color: var(--secondary);
    text-decoration: none;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .ekh-nav-mega-link:hover {
    color: var(--primary);
    background: color-mix(in srgb, var(--ekh-nav-accent) 10%, var(--theme));
  }

  .ekh-nav-mega-link.is-active {
    color: var(--ekh-nav-accent);
    font-weight: 700;
    background: color-mix(in srgb, var(--ekh-nav-accent) 14%, var(--theme));
  }

  .ekh-nav-mega-all {
    display: block;
    margin-top: 0.75rem;
    padding-top: 0.65rem;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--secondary);
    text-decoration: none;
    text-align: center;
  }

  .ekh-nav-mega-all:hover {
    color: var(--primary);
  }

  .ekh-nav-link--current {
    max-width: 11rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--primary);
    border-color: var(--border);
    background: var(--code-bg);
  }

  .ekh-nav-current-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ekh-nav-accent, #0d9488);
    flex-shrink: 0;
  }
  .ekh-nav-mega-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 150;
    background: transparent;
  }

  .ekh-nav-mega-backdrop.is-visible {
    display: block;
  }

  @media (max-width: 768px) {
    .logo a {
      font-size: 1.05rem;
      max-width: 11rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
    }

    .ekh-nav-mega-panel {
      position: fixed;
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      min-width: 0;
      max-width: none;
      border-radius: 16px 16px 0 0;
      padding: 1rem 1rem 1.25rem;
      max-height: 75vh;
      overflow-y: auto;
    }

    .ekh-nav-mega-inner {
      grid-template-columns: 1fr;
    }

    .ekh-nav-current {
      display: none;
    }
  }

  @media (min-width: 769px) {
    .ekh-nav-mega-group:last-child:nth-child(odd) {
      grid-column: 1 / -1;
    }
  }

  /* Override PaperMod horizontal-tab underline */
  #menu .active {
    border-bottom: none !important;
  }
</style>
