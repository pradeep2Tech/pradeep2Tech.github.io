{{- if .IsHome -}}
<style>
  .ekh-hub {
    margin: 0.5rem 0 3rem;
    display: flex;
    flex-direction: column;
    gap: 2.25rem;
  }

  .ekh-group {
    --ekh-accent: #4f46e5;
    padding: 1.35rem 1.35rem 1.5rem;
    border-radius: 14px;
    background: linear-gradient(
      145deg,
      color-mix(in srgb, var(--ekh-accent) 8%, var(--entry)) 0%,
      var(--entry) 55%
    );
    border: 1px solid color-mix(in srgb, var(--ekh-accent) 22%, var(--border));
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  html[data-theme="dark"] .ekh-group {
    background: linear-gradient(
      145deg,
      color-mix(in srgb, var(--ekh-accent) 14%, var(--entry)) 0%,
      var(--entry) 60%
    );
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.22);
  }

  .ekh-group-head {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 1.15rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid color-mix(in srgb, var(--ekh-accent) 18%, var(--border));
  }

  .ekh-group-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ekh-accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--ekh-accent) 25%, transparent);
    flex-shrink: 0;
  }

  .ekh-group-title {
    margin: 0;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ekh-accent);
  }

  .curriculum-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.85rem;
    margin: 0;
  }

  .curriculum-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1rem 1rem 0.85rem;
    border-radius: 10px;
    background: var(--theme);
    border: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease,
      border-color 0.18s ease;
  }

  .curriculum-card:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--ekh-accent) 45%, var(--border));
    box-shadow:
      0 8px 24px color-mix(in srgb, var(--ekh-accent) 16%, transparent),
      0 2px 6px rgba(0, 0, 0, 0.06);
  }

  .curriculum-card-accent {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(
      180deg,
      var(--ekh-accent),
      color-mix(in srgb, var(--ekh-accent) 55%, #fff)
    );
    border-radius: 10px 0 0 10px;
  }

  .curriculum-card-body {
    flex: 1;
    min-width: 0;
    padding-left: 0.35rem;
  }

  .curriculum-card-title {
    margin: 0 0 0.35rem;
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.3;
  }

  .curriculum-card-meta {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--secondary);
    text-transform: none;
    letter-spacing: 0;
  }

  .curriculum-card-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.5rem;
    height: 1.35rem;
    padding: 0 0.4rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ekh-accent);
    background: color-mix(in srgb, var(--ekh-accent) 14%, var(--theme));
    border: 1px solid color-mix(in srgb, var(--ekh-accent) 28%, var(--border));
  }

  .curriculum-card-arrow {
    flex-shrink: 0;
    font-size: 1.1rem;
    font-weight: 600;
    color: color-mix(in srgb, var(--ekh-accent) 70%, var(--secondary));
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .curriculum-card:hover .curriculum-card-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* Group-specific accent presets (fallback if inline var missing) */
  .ekh-group--design { --ekh-accent: #4f46e5; }
  .ekh-group--handbooks { --ekh-accent: #0d9488; }
  .ekh-group--practice { --ekh-accent: #7c3aed; }
  .ekh-group--career { --ekh-accent: #d97706; }
  .ekh-group--security { --ekh-accent: #e11d48; }

  @media (max-width: 640px) {
    .ekh-group {
      padding: 1rem;
    }
    .curriculum-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
{{- end -}}
